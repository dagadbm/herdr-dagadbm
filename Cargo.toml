[package]
name = "dagadbm"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "dagadbm's Herdr plugin: a home for small features, starting with configurable macOS notifications."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies.cargo-husky]
version = "1.5.0"
default-features = false
features = ["user-hooks"]
