id = "dagadbm"
name = "dagadbm"
version = "0.1.0"
min_herdr_version = "0.9.5"
description = "dagadbm's Herdr plugin: configurable clickable macOS notifications, and more to come."
platforms = ["macos"]

[[build]]
command = ["cargo", "build", "--release"]

# --- notify ---

[[startup]]
command = ["target/release/dagadbm", "notify", "--cleanup"]

[[actions]]
id = "notify-test"
title = "Notify: send a test notification"
command = ["target/release/dagadbm", "notify", "--test"]

[[actions]]
id = "notify-init-config"
title = "Notify: write a config file with every default"
command = ["target/release/dagadbm", "notify", "--init-config"]

[[actions]]
id = "notify-clear-terminal-bindings"
title = "Notify: clear saved terminal bindings"
command = ["target/release/dagadbm", "notify", "--clear-terminal-bindings"]

[[events]]
on = "pane.agent_status_changed"
command = ["target/release/dagadbm", "notify"]

[[events]]
on = "pane.focused"
command = ["target/release/dagadbm", "notify"]
